<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign in</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- <header>
        <div class="menu">&#9776;</div>
        <h2>Furniture design</h2>
    </header> -->

    <main>
        <div class="register-container">

            <!-- Chair Image -->
            <div class="chair-image">
                <img src="Assets/stylish-chair.png" alt="">
            </div>

            <!-- Registration Form -->
            <div class="register-form">

                <h3>Create Account</h3>

                <button class="google-btn" type="button">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                    Sign up with Google
                </button>
                <p class="or">OR</p>

                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Muazu Aisha Nana" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="nanamuazu11@gmail.com" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="aishamuazu" required>

                    <label for="confirm-password">
                        Confirm Password
                    </label>
                    <input type="password" id="confirm-password" placeholder="aishamuazu" required>

                    <button class="create-btn" type="submit">
                        Create Account
                    </button>
                </form>

                <p class="login">
                    Already have an account?
                    <a href="login.html">Log in</a>
                </p>

            </div>

        </div>
    </main>

</body>

</html>
